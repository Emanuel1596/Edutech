services:
  postgres:
    image: postgres:16
    container_name: edutech_postgres
    restart: always
    environment:
      POSTGRES_DB: bd_edutech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - edutech_postgres_data:/var/lib/postgresql/data

volumes:
  edutech_postgres_data: